    o_journey:
    - 'leaf1: vtysh -c "show ip route 10.0.2.0/24"'
    - 'leaf1: sonic-db-cli APPL_DB keys "ROUTE_TABLE:10.0.2.0/24"'
    - 'leaf1: sonic-db-cli ASIC_DB keys "ASIC_STATE:SAI_OBJECT_TYPE_NEXT_HOP_GROUP*"'
    o_timers:
    - 'leaf1: show bgp neighbors 10.0.12.1'
    o_messages:
    - 'leaf1: show bgp neighbors 10.0.12.1'
    o_dataplane:
    - 'h1: ping -c 5 10.0.2.10'
    - 'leaf1: show bgp summary'
    - 'leaf1: show ip route 10.0.2.0/24'
  vocabulary:
  - show bgp*
  - show ip bgp*
  - show ip route*
  - show ip interfaces*
  - show interfaces status*
  - show interfaces counters*
  - vtysh*
  - config bgp shutdown*
  - config bgp startup*
  - config interface shutdown*
  - config interface startup*
  - sonic-db-cli APPL_DB *
  - sonic-db-cli ASIC_DB *
  - sonic-db-cli STATE_DB *
  - sonic-db-cli CONFIG_DB *
  - redis-cli *
  - ping*
  - ip route*
  - ip neigh*
chaos_options:
- id: c_shut_one_link
  label: 'Cut one of two roads: shut a single inter-switch link'
  type: link
  inject:
  - 'leaf1: sudo config interface shutdown Ethernet0'
  restore:
  - 'leaf1: sudo config interface startup Ethernet0'
  - 'h1: ping -c 3 10.0.2.10'
  expected_effects:
  - 'With fast-fallover, the session over Ethernet0 (neighbor 10.0.12.1) drops within a second — no hold-time wait. ECMP for 10.0.2.0/24 collapses from two next-hops to one (via 10.0.12.3); the route survives, traffic reroutes to the surviving link. Expect near-zero data loss — a handful of packets at most during reconvergence `[VERIFY-ON-LAB: loss window on vs]`. `show bgp summary` shows one neighbor Idle/Active, one still Established. Recovery: link up → session re-establishes in a few seconds → route returns to two next-hops.'
  risk: low
  enabled: true
  plan_b: carrier loss on the veth from the container host would be a truer "cable pull," but host-side actions are out of scope; the admin shutdown is the sanctioned equivalent and still triggers fast-fallover.
- id: c_shut_both_links
  label: 'Total isolation: cut both roads'
  type: link
  inject:
  - 'leaf1: sudo config interface shutdown Ethernet0,Ethernet4'
  restore:
  - 'leaf1: sudo config interface startup Ethernet0,Ethernet4'
  - 'h1: ping -c 5 10.0.2.10'
  expected_effects:
  - 'Both sessions drop within ~1 s (fast-fallover). 10.0.2.0/24 loses *all* next-hops and is withdrawn from the table entirely; h1→h2 goes to 100% loss. The starkest control-plane→data-plane consequence: no route, no forwarding. Recovery: both links up → both sessions re-establish within a few seconds → route and ECMP fully return.'
  risk: medium
  enabled: true
  plan_b: 'shut the two links on **leaf2** instead (`leaf2: sudo config interface shutdown Ethernet0,Ethernet4`) — identical effect from the peer''s side.'
- id: c_bgp_admin_shut
  label: 'Polite goodbye: administratively shut one neighbor'
  type: config
  inject:
  - 'leaf1: sudo config bgp shutdown neighbor 10.0.12.1'
  restore:
  - 'leaf1: sudo config bgp startup neighbor 10.0.12.1'
  - 'h1: ping -c 3 10.0.2.10'
  expected_effects:
  - 'A NOTIFICATION tears down just that session; `show bgp summary` shows 10.0.12.1 as `Idle (Admin)`. The **link stays up** — the perfect control-vs-data contrast to option 1: same ECMP-halving effect on the route, but the physical interface is untouched and Ethernet0''s counters keep any non-BGP traffic. Route drops to one next-hop; minimal data loss. Recovery: `startup neighbor` re-establishes in a few seconds.'
  risk: low
  enabled: true
  plan_b: '`leaf1: sudo config bgp shutdown all` / `startup all` — tears down *both* sessions administratively while both links stay up (contrast with option 2''s link-down total loss).'
- id: c_hold_timer_blackhole
  label: 'Silent peer: drop BGP packets, keep the link up'
  type: config
  inject:
  - 'leaf1: iptables -A INPUT -p tcp --dport 179 -s 10.0.12.1 -j DROP'
  - 'leaf1: iptables -A INPUT -p tcp --sport 179 -s 10.0.12.1 -j DROP'
  restore:
  - 'leaf1: iptables -D INPUT -p tcp --dport 179 -s 10.0.12.1 -j DROP'
  - 'leaf1: iptables -D INPUT -p tcp --sport 179 -s 10.0.12.1 -j DROP'
  - 'h1: ping -c 3 10.0.2.10'
  expected_effects:
  - 'THE hold-timer demonstration. The link stays up and the session reads Established for the first several seconds because no carrier signal says otherwise — but keepalives from 10.0.12.1 no longer arrive. At **~10 s** (hold time) leaf1 declares the session dead with a "hold timer expired" NOTIFICATION and only *then* halves ECMP. If the flow was hashed onto that link, traffic is black-holed for the whole hold window while everything *looks* healthy — the operational nightmare this course exists to teach `[VERIFY-ON-LAB: exact expiry ≈ hold time; which flows are affected depends on hashing]`. Recovery: delete the rules; session re-establishes in seconds.'
  risk: medium
  enabled: true
  plan_b: extend the silence to *both* directions by also dropping leaf1's **outbound** BGP (`iptables -A OUTPUT -p tcp --dport 179 -d 10.0.12.1 -j DROP` plus the matching `--sport 179` rule; remove with `-D` on restore) — then each side expires on its own hold clock, instead of only leaf1 as in the primary (which drops inbound only).
- id: c_withdraw_only
  label: 'Session up, route gone: withdraw the prefix'
  type: config
  inject:
  - 'leaf2: vtysh -c "configure terminal" -c "router bgp 65002" -c "address-family ipv4 unicast" -c "no network 10.0.2.0/24"'
  restore:
  - 'leaf2: vtysh -c "configure terminal" -c "router bgp 65002" -c "address-family ipv4 unicast" -c "network 10.0.2.0/24"'
  - 'h1: ping -c 3 10.0.2.10'
  expected_effects:
  - 'The purest control-vs-data lesson. Both sessions stay perfectly Established (keepalives flow), but leaf2 sends an UPDATE **withdrawing** 10.0.2.0/24. leaf1 removes the route from its table; h1→h2 dies with `show bgp summary` looking flawless. "BGP is up" and "the route exists" are shown to be different facts. Recovery: re-originate; the UPDATE re-adds the prefix in seconds.'
  risk: medium
  enabled: false
  plan_b: on leaf2, remove the Vlan20 IP so the *connected* origin of 10.0.2.0/24 disappears (blunter, also withdraws the prefix).
- id: c_wrong_asn
  label: 'Identity mismatch: wrong remote-AS'
  type: config
  inject:
  - 'leaf1: vtysh -c "configure terminal" -c "router bgp 65001" -c "neighbor 10.0.12.1 remote-as 65099"'
  restore:
  - 'leaf1: vtysh -c "configure terminal" -c "router bgp 65001" -c "neighbor 10.0.12.1 remote-as 65002"'
  - 'h1: ping -c 3 10.0.2.10'
  expected_effects:
  - 'The OPEN handshake now fails: leaf1 expects AS 65099 but 10.0.12.1 identifies as 65002, so a NOTIFICATION ("Bad Peer AS") fires and the FSM cannot reach Established — it flaps Idle/Active/Connect. ECMP halves to the one good session. Teaches that peering requires *agreement*, checked at OPEN. Recovery: correct the AS; session climbs to Established.'
  risk: medium
  enabled: false
  plan_b: edit `CONFIG_DB BGP_NEIGHBOR|10.0.12.1` asn and restart the bgp service (heavier, more deterministic than a live vtysh edit).
- id: c_clear_bgp
  label: 'Hard reset: clear all BGP sessions'
  type: churn
  inject:
  - 'leaf1: vtysh -c "clear ip bgp *"'
  restore:
  - 'h1: ping -c 5 10.0.2.10'
  - 'leaf1: show bgp summary'
  expected_effects:
  - 'Both sessions are forcibly torn down and rebuilt from Idle → OPEN → … → Established. Uptime in `show bgp summary` resets to near-zero (your reconvergence stopwatch). Brief route churn as prefixes re-advertise; short, small data loss during the rebuild `[VERIFY-ON-LAB: loss window]`. A clean way to watch the FSM climb live. Recovery is automatic within a few seconds.'
  risk: low
  enabled: true
  plan_b: '`leaf1: vtysh -c "clear ip bgp * soft"` — a *soft* clear that re-processes routes **without** dropping the sessions (contrast: uptime does NOT reset, no FSM restart).'
- id: c_stop_bgp_service
  label: 'Kill the routing brain: stop the bgp container'
  type: service
  inject:
  - 'leaf1: sudo systemctl stop bgp'
  restore:
  - 'leaf1: sudo systemctl start bgp'
  - 'h1: ping -c 5 10.0.2.10'
  expected_effects:
  - 'bgpd, zebra, and fpmsyncd all die. Sessions drop (leaf2 will time out its side at hold). The revealing question: does h1→h2 keep working? If the chip retains its programmed routes, forwarding may persist even with the whole routing brain gone — control plane dead, data plane alive `[VERIFY-ON-LAB: whether ROUTE_TABLE/ASIC route lingers and for how long]`. Recovery: start bgp → sessions re-establish → fpmsyncd re-syncs routes into APPL_DB.'
  risk: medium
  enabled: true
  plan_b: '`leaf1: docker exec bgp supervisorctl stop bgpd` — kill only bgpd while zebra/fpmsyncd live (subtler: existing routes may persist in zebra→APPL_DB longer).'
- id: c_link_flap
  label: The flapping link
  type: churn
  inject:
  - 'leaf1: sh -c ''for i in 1 2 3 4 5; do sudo config interface shutdown Ethernet0; sleep 2; sudo config interface startup Ethernet0; sleep 5; done'''
  restore:
  - 'leaf1: sudo config interface startup Ethernet0'
  - 'h1: ping -c 5 10.0.2.10'
  expected_effects:
  - 'Ethernet0''s session repeatedly drops and re-establishes; ECMP oscillates between one and two next-hops; message counters (OPEN/NOTIFICATION) climb with each cycle; brief repeated loss for flows hashed onto that link. FRR applies no route dampening by default, so every flap fully reconverges — teaches both resilience and the churn cost of an unstable link. Recovery: ensure the final state is up.'
  risk: medium
  enabled: false
  plan_b: flap the *session* instead of the link — loop `vtysh -c "clear ip bgp 10.0.12.1"` — churn without touching the interface.
