  suggested_questions:
    q_peering:
    - What does "Established" mean in `show bgp summary`, and how do I tell at a glance?
    - Why do leaf1 and leaf2 have different AS numbers, and what makes this eBGP?
    - What are the two neighbors leaf1 has, and why two?
    q_advertise:
    - What's the difference between advertised-routes and received-routes?
    - Which prefix does leaf1 advertise, and which does it receive?
    - Why does leaf1 receive 10.0.2.0/24 over both links?
    q_routes:
    - How does the router pick between 10.0.1.0/24 and 10.0.2.0/24 for a packet to h2?
    - What do the C and B source codes mean in `show ip route`?
    - Why is 10.0.2.0/24 a BGP route while 10.0.12.0/31 is connected?
    q_ecmp:
    - Why does 10.0.2.0/24 have two next-hops instead of one?
    - Does ECMP use both links at once or keep one as backup?
    - How does the switch decide which link a given flow takes?
    q_journey:
    - Trace 10.0.2.0/24 from bgpd all the way to the chip.
    - What does fpmsyncd do, and why is it the on-ramp to the SONiC pipeline?
    - How is a route's path to hardware different from a VLAN's (Lesson 2)?
    q_timers:
    - What are keepalive and hold time, and what are they in this lab?
    - Why does a silent peer take ~10 s to detect but a dead link is instant?
    - What is fast-fallover, and when does it help?
    q_messages:
    - What are the four BGP message types and what does each do?
    - Which message tears a session down, and how would I see it?
    - What do rising KEEPALIVE counts versus a jump in UPDATEs tell you?
    q_dataplane:
    - What's the difference between the control plane and the data plane here?
    - Why might h1→h2 keep working after you stop the bgp container?
    - How can the session be Established while the ping fails?
