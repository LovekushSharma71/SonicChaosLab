  - sonic
  - architecture
  - container
  - docker
  - docker ps
  - feature
  - feature status
  - swss
  - orchagent
  - syncd
  - sai
  - bgp container
  - lldp container
  - database container
  - redis
  - config_db
  - appl_db
  - asic_db
  - state_db
  - counters_db
  - pipeline
  - producer
  - consumer
  - subscribe
  - publish
  - propagation
  - propagation lag
  - eventual consistency
  - intent
  - readback
  - oper_status
  - admin_status
  - mgrd
  - manager
  - syncer
  - vlanmgrd
  - portmgrd
  - portsyncd
  - fpmsyncd
  - sonic-db-cli
  - dbsize
  - keys
  - hgetall
  - vid
  - rid
  - vidtorid
  - flex counter
  - name map
  - supervisord
  - supervisorctl
  - process
  - daemon
  - systemctl
  - config reload
  suggested_questions:
    q_containers:
    - What are the main SONiC containers and what does each one do?
    - What's the difference between a feature being "enabled" and its container being "running"?
    - Which containers form the spine of the forwarding pipeline, and why those?
    q_configdb:
    - What exactly does CONFIG_DB hold, and what does it *not* hold?
    - If CONFIG_DB is just data, how does writing to it ever change the hardware?
    - Where did the VLAN and port settings from Lesson 1 actually go?
    q_pipeline:
    - Walk me through every stop Vlan30 made from `config vlan add 30` to the chip.
    - Why isn't the change atomic — what does "eventual consistency" mean here?
    - Which process moves data from CONFIG_DB to APPL_DB, and which from APPL_DB to ASIC_DB?
    q_statedb:
    - What's the difference between CONFIG_DB and STATE_DB for a port?
    - When would `admin_status` and `oper_status` legitimately disagree?
    - Which database is the "Oper" column of `show interfaces status` really reading?
    q_asicdb:
    - What is a SAI object, and why does ASIC_DB use them instead of vendor commands?
    - What is the VID-to-RID map for?
    - Where did the learned MAC from Lesson 1 live in this database?
    q_counters:
    - Why did `show interfaces counters` sometimes lag behind my traffic in Lesson 1?
    - What is COUNTERS_PORT_NAME_MAP and why is it needed?
    - Which process fills COUNTERS_DB, and how often?
    q_admin_path:
    - Trace `admin_status` from CONFIG_DB to STATE_DB after a shutdown.
    - Why did we pick Ethernet4 for this trace instead of Ethernet8?
    - In what order do the databases reflect the shutdown, and why that order?
    q_procs:
    - What is supervisord doing inside each container?
    - Which processes live in swss, and which in bgp?
    - Why can one daemon crash without rebooting the whole switch?
