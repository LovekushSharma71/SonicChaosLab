- pipeline internals beyond locating the mtu field (Lesson 2)
- BGP internals beyond the MSS point (Lesson 3)
redirect_line: Good question, but it's outside this lesson's focus — MTU, fragmentation, and the 'up but broken' failure class on this fabric. I'd recommend reading it up separately (RFC 1191 on PMTUD, or a jumbo-frame primer). Let's get back to the size sweep on leaf1 — pick a suggested question or run another on-topic command.
