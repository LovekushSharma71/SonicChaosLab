  - access port
  - untagged
  - tagged
  - trunk
  - membership
  - lldp
  - neighbor
  - discovery
  - ttl
  - link
  - port
  - interface
  - admin
  - oper
  - operational
  - link up
  - link down
  - shutdown
  - startup
  - aging
  - age out
  - expire
  - arp
  - arp table
  - ip neighbor
  - gateway
  - default gateway
  - svi
  - vlan interface
  - counters
  - rx
  - tx
  - drops
  - errors
  - redis
  - appl_db
  - asic_db
  - config_db
  - fdb_table
  - lldp_entry_table
  - sonic-db-cli
  - ping
  - icmp
  - loss
  - ethernet0
  - ethernet4
  - ethernet8
  - vlan10
  - h1
  - leaf1
  suggested_questions:
    q_ports:
    - What is the difference between the Admin and Oper columns?
    - Why can a port be Admin up but Oper down — what are the possible causes?
    - Which ports on leaf1 go to leaf2 and which go to h1, and how would I check without a diagram?
    q_lldp:
    - Why does leaf2 appear twice in the LLDP table?
    - Why doesn't h1 show up as an LLDP neighbor?
    - If I unplug a cable, how long until LLDP notices, and why the delay?
    q_vlan:
    - What does "untagged" mean in the member list, and what would "tagged" change?
    - Why does Vlan10 have an IP address — I thought switches don't have IPs?
    - If I created Vlan20 on leaf1 and put a host in it, could it talk to h1? Why not?
    q_mac:
    - Walk me through exactly how h1's MAC ended up in this table — who wrote it?
    - What happens to a frame whose destination MAC is not in the table?
    - Why did pinging the *gateway* teach the switch about *h1* — isn't that backwards?
    q_age:
    - What is the aging time on this switch, and what exactly happens when it expires for an entry?
    - Why forget entries at all — wouldn't a permanent table be faster?
    - What's the worst case a user experiences right after an entry ages out?
    q_redis:
    - Which database actually holds the learned MAC we just created, and why that one?
    - What's the difference between APPL_DB and ASIC_DB in one sentence each?
    - If `show mac` and the Redis FDB keys disagreed, which would you trust and why?
    q_counters:
    - Why did we run sonic-clear counters first — what does it actually reset?
    - Which counters should move during our ping burst, and by roughly how much?
    - What does a rising RX_DRP with flat RX_ERR suggest, versus the reverse?
    q_boundary:
    - The ping to h3 worked — so why is h3's MAC absent from leaf1's table?
    - What exactly did h1 put in the destination-MAC field of those frames, and how did it know it?
    - Where does the switch's L2 job end and something else take over, physically and logically?
    q_baseline:
    - What is the difference between the Admin and Oper columns?
    - Why can a port be Admin up but Oper down — what are the possible causes?
    - Which ports on leaf1 go to leaf2 and which go to h1, and how would I check without a diagram?
    q_impact:
    - What changed after the injection — which ports, MAC entries, or pings?
    - Why did reachability break or survive the way it did?
    - What would restore have to undo to heal this?
