  - sonic-db-cli CONFIG_DB *
  - sonic-db-cli STATE_DB *
  - redis-cli *
  - ping*
  - ip neigh*
  - ip link show*
  - ip addr show*
  - sonic-clear counters
  - sonic-clear fdb*
  - config interface shutdown*
  - config interface startup*
  - config vlan*
  - config interface ip*
  - config feature state lldp*
  - supervisorctl status*
chaos_options:
- id: c_shut_access
  label: 'Unplug the host: shut h1''s access port'
  type: config
  inject:
  - 'leaf1: sudo config interface shutdown Ethernet8'
  restore:
  - 'leaf1: sudo config interface startup Ethernet8'
  - 'h1: ping -c 3 10.0.1.1'
  - 'h2: ping -c 2 10.0.1.1'
  expected_effects:
  - 'Ethernet8 flips to Admin down and Oper down within a second or two. h1→gateway ping goes to 100% loss immediately. h1''s FDB entry disappears (flush on port-down) `[VERIFY-ON-LAB: whether vs flushes immediately or entry lingers until aging]`. VLAN membership, LLDP entries on Ethernet0/4, and inter-switch state are untouched. After restore: link returns Oper up within seconds; first ping re-ARPs and re-learns; loss ends immediately after link-up.'
  risk: low
  enabled: true
  plan_b: 'shut from the *host* side instead — `h1: ip link set eth1 down` / `... up`. Same user impact, but leaf1 shows Ethernet8 Admin **up** / Oper **down** — the perfect admin-vs-operational teaching contrast.'
- id: c_clear_fdb
  label: 'Total amnesia: flush the MAC table'
  type: config
  inject:
  - 'leaf1: sonic-clear fdb all'
  - 'leaf1: bridge fdb flush dev Bridge dynamic'
  restore:
  - 'h1: ping -c 3 10.0.1.1'
  - 'h2: ping -c 2 10.0.1.1'
  - 'leaf1: bridge fdb show br Bridge'
  expected_effects:
  - 'MAC entry count drops to zero (or near zero) instantly. User traffic is barely dented: the next frame to an unknown MAC floods, the reply relearns, so expect zero or at most one lost ping `[VERIFY-ON-LAB: first-ping loss after flush]`. This is the "failure" that isn''t one — it teaches that the FDB is a disposable cache.'
  risk: low
  enabled: true
  plan_b: natural aging instead of a flush — stop all traffic from h1 and wait out the aging time (slow; shows the same lifecycle without a command).
- id: c_vlan_member_del
  label: 'Kicked out of the club: remove Ethernet8 from Vlan10'
  type: config
  inject:
  - 'leaf1: sudo config vlan member del 10 Ethernet8'
  restore:
  - 'leaf1: sudo config vlan member add -u 10 Ethernet8'
  - 'h1: ping -c 3 10.0.1.1'
  expected_effects:
  - Port stays Oper/Admin up — status looks perfect. But h1's untagged frames now arrive at a port with no VLAN membership and are dropped at ingress; h1→gateway ping goes to 100% loss within a second. h1's FDB entry vanishes (membership gone) and never relearns. First taste of "up but broken."
  risk: medium
  enabled: true
  plan_b: 'flip the port out of L2 entirely: `leaf1: sudo config switchport mode routed Ethernet8` (restore: `... mode access Ethernet8` then re-add membership) `[VERIFY-ON-LAB: mode change ordering constraints with existing membership]`.'
- id: c_wrong_vlan
  label: 'Right port, wrong neighborhood: move Ethernet8 to Vlan50'
  type: config
  inject:
  - 'leaf1: sudo config vlan add 50'
  - 'leaf1: sudo config vlan member del 10 Ethernet8'
  - 'leaf1: sudo config vlan member add -u 50 Ethernet8'
  restore:
  - 'leaf1: sudo config vlan member del 50 Ethernet8'
  - 'leaf1: sudo config vlan member add -u 10 Ethernet8'
  - 'leaf1: sudo config vlan del 50'
  - 'h1: ping -c 3 10.0.1.1'
  expected_effects:
  - 'Same user pain as option 3 (gateway ping 100% loss) but *different evidence*: the port is up AND the switch happily learns h1''s MAC — in VLAN 50. `show mac` shows the entry alive in the wrong VLAN; Vlan50 has no gateway IP, so ARP for 10.0.1.1 dies unanswered inside an isolated broadcast domain. Teaches: learning ≠ working; VLANs isolate ruthlessly.'
  risk: medium
  enabled: true
  plan_b: 'leave Ethernet8 in Vlan10 but add it as **tagged** instead of untagged (`config vlan member del 10 Ethernet8` then `config vlan member add 10 Ethernet8`): host sends untagged, switch now expects tagged — mismatch with subtler symptoms `[VERIFY-ON-LAB: untagged-frame handling on tagged-only member in vs]`.'
- id: c_gw_ip_remove
  label: The switch part works, the gateway is gone
  type: config
  inject:
  - 'leaf1: sudo config interface ip remove Vlan10 10.0.1.1/24'
  restore:
  - 'leaf1: sudo config interface ip add Vlan10 10.0.1.1/24'
  - 'h1: ping -c 3 10.0.1.1'
  expected_effects:
  - 'Everything L2 stays healthy: port up, VLAN membership intact, LLDP fine, h1''s MAC learned (its ARP broadcasts still flood and still teach). But nobody owns 10.0.1.1 anymore, so h1''s ARP goes unanswered and both pings (to gateway and to h3) fail — h1→h3 dies because the escape door out of Vlan10 is gone. The subtle one: every L2 table looks perfect; only `show ip interfaces` betrays the missing address. Loss is immediate either way; only the error signature differs — with a warm ARP cache h1 keeps transmitting echo requests that nothing answers (silent timeouts), with a cold cache the failure surfaces one step earlier as unanswered ARP ("Destination Host Unreachable") `[VERIFY-ON-LAB: confirm both signatures]`.'
  risk: medium
  enabled: true
  plan_b: remove Vlan20's IP on leaf2 instead — breaks only the h3-side return path; h1's gateway pings keep working while end-to-end dies (splits the failure between L2-local health and end-to-end reachability).
- id: c_lldp_stop
  label: 'Silence the introductions: disable LLDP'
  type: service
  inject:
  - 'leaf1: sudo config feature state lldp disabled'
  restore:
  - 'leaf1: sudo config feature state lldp enabled'
  expected_effects:
  - 'Zero data-plane impact — both pings keep working at 0% loss the whole time (the proof that discovery ≠ forwarding). leaf1''s lldp container stops (visible via `docker ps` / `show feature status`); leaf1''s own neighbor table empties immediately or shortly after container stop `[VERIFY-ON-LAB: local table behavior on stop]`. The interesting slow burn happens on the *peer*: leaf2 keeps showing leaf1 as a neighbor until the TTL runs out (~120 s) — silence is detected on a delay `[VERIFY-ON-LAB: exact ageout timing on vs]`. After restore, entries reappear within one announcement interval (~30 s).'
  risk: low
  enabled: false
  plan_b: '`leaf1: sudo systemctl stop lldp` / `sudo systemctl start lldp` (service-level instead of feature-level — same effect, different management surface).'
- id: c_mac_flap
  label: 'Identity crisis: h1 keeps changing its MAC'
  type: churn
  inject:
  - 'h1: sh -c ''for i in 1 2 3 4 5; do ip link set eth1 down; ip link set eth1 address 02:00:00:00:01:1$i; ip link set eth1 up; sleep 1; ping -c 1 -W 1 10.0.1.1; done'''
  restore:
  - 'h1: sh -c ''ip link set eth1 down; ip link set eth1 address 02:00:00:00:01:10; ip link set eth1 up'''
  - 'h1: ping -c 3 10.0.1.1'
  expected_effects:
  - 'The FDB churns: entry count stays ~1 for Ethernet8 but the MAC value keeps changing — last writer wins. Old identities linger until aging removes them, so intermediate reads may show several 02:00:00:00:01:1x entries `[VERIFY-ON-LAB: whether vs keeps multiple or replaces]`. Gateway ARP re-resolves each flap; expect a lost ping per identity change. Teaches: the FDB tracks *claims*, not truth — whoever spoke last owns the entry.'
  risk: medium
  enabled: false
  plan_b: create a macvlan sub-interface on h1 with a second MAC and alternate pings between the two identities (no link flapping — pure table churn).
- id: c_static_mac_wrong_port
  label: 'Poisoned map: pin h1''s MAC to the wrong port'
  type: config
  inject:
  - 'leaf1: sonic-db-cli CONFIG_DB hset "FDB|Vlan10|02:00:00:00:01:10" port Ethernet0'
  - 'leaf1: sonic-db-cli CONFIG_DB hset "FDB|Vlan10|02:00:00:00:01:10" type static'
  restore:
  - 'leaf1: sonic-db-cli CONFIG_DB del "FDB|Vlan10|02:00:00:00:01:10"'
  - 'leaf1: sonic-clear fdb all'
  - 'h1: ping -c 3 10.0.1.1'
  expected_effects:
  - 'If the write is consumed: `show mac` gains a Static entry claiming h1 lives on Ethernet0 (the inter-switch link). Frames *to* h1 now exit the wrong port and vanish; h1''s own frames still arrive but the static entry outranks learning, so the blackhole persists — the "wrong is worse than missing" lesson made real. Gateway→h1 direction dies while h1→switch traffic keeps flowing: asymmetric, silent, everything "up."'
  risk: high
  enabled: false
  plan_b: 'poison from the traffic side instead — from h3''s L2 domain this is not reachable in this topology, so the realistic alternative is a gratuitous-ARP style claim: give a scratch container on Vlan10 h1''s IP with a different MAC and let it talk `[VERIFY-ON-LAB: requires an extra Vlan10 attachment; skip unless topology grows]`.'
observe:
  facts:
  - interface_status
  - mac_table
  - lldp_neighbors
  - vlan_membership
  - ping_loss
  - redis_keys
  measure_recovery: true
