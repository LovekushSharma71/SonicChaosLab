    - 'leaf1: show vlan config'
    o_mac:
    - 'leaf1: sonic-clear fdb all'
    - 'leaf1: bridge fdb flush dev Bridge dynamic'
    - 'leaf1: bridge fdb show br Bridge'
    - 'h1: ping -c 3 10.0.1.1'
    - 'leaf1: bridge fdb show br Bridge'
    - 'leaf1: show mac'
    o_age:
